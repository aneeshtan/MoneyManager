  - id: localization.runtime-language-switch
    ios: MManger/Extensions/AppLanguage+RTL.swift; MManger/Views/RootView.swift
    android: app/ProMoneyManagerApp.kt; app/MainActivity.kt; app/RegionalSettingsScreen.kt
    acceptance: Selecting any supported language updates Android's per-app locale, recreates/recomposes the UI with that locale, persists across relaunch, and mirrors the full interface for Arabic and Persian.
    evidence: "Corrected from a prior YAML error: there is no app/AppLocaleController.kt file, and there never has been. The actual mechanism is a LaunchedEffect in ProMoneyManagerApp.kt that calls AppCompatDelegate.setApplicationLocales(...) whenever regionalSettings.language changes; MainActivity extends AppCompatActivity, which androidx.appcompat automatically recreates on a per-app locale change. This mechanism predates this session (already present on the codex/android-parity-repair branch) and was not modified here. core/model/PrivacySettingsTest.kt covers persistence of the selected language; LocalizationResourcesTest.kt (Robolectric) covers per-locale resource resolution and RTL layout direction for ar/fa. No instrumented test drives a live in-app language switch end-to-end (select language -> UI updates -> relaunch persists) — this still needs on-device verification."
    status: in_progress
