    evidence: "core/domain/DashboardAnalyticsTest.kt; app/DashboardInsightsTest.kt. CORRECTION to a prior 'verified' status on this session's own self-audit: DashboardInsight previously carried pre-built English sentences (title/message) baked in the domain layer, and the 'Dominant category' sentence embedded the raw CategoryId string (e.g. 'category-food') instead of a resolved category name — so the Stats screen's insight cards showed a raw internal id to the user and never localized regardless of the app's 8 supported languages. Fixed by having DashboardInsight carry structured data (kind, count, categoryId) instead of prose, and moving message construction into StatsScreen.kt's new insightCopy() using stringResource with the existing categoryNames lookup and 8 new localized string keys (dominant_category_title/message, uncategorized_spending_title/message, possible_duplicates_title/message, spending_increased_title/message) added across all locale files. testDebugUnitTest and compileDebugKotlin passed; added a regression assertion that the DOMINANT_CATEGORY insight carries the correct CategoryId. Visual rendering in each of the 8 languages was not verified on-device — no emulator available this session."
