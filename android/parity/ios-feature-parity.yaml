  - id: import.statement-parsing
    ios: MManger/Views/ImportView.swift
    android: core/domain/ImportParsers.kt
    acceptance: Text extracted from a user-selected searchable PDF, plain text, CSV headers, pasted card messages, statement currency headers, pagination noise, and duplicate flags is parsed locally into review drafts; XLSX/XLS are explicitly rejected with an actionable message to export as CSV rather than parsed.
    evidence: "core/domain/ImportParsersTest.kt. This session found and fixed a real robustness bug: Money.parseStrict (called from buildRow) throws when a line's amount has more decimal precision than the currency allows (e.g. OCR/paste garbling '58.00' into '58.005'), and CurrencyCode.of throws on a malformed CSV currency cell; neither was caught anywhere in the per-row parsing path, so ONE bad line anywhere in a statement aborted UniversalImportParser.parseText entirely and AppViewModel.parseImport's runCatching then discarded every already-parsed valid row along with it, surfacing only a generic 'Import parsing failed.' toast. Fixed by wrapping every buildRow call site (strict-statement, plain-text, pasted-message, CSV) in runCatching so a malformed row is now skipped rather than failing the whole batch, and by making CSV currency-cell parsing and statement currency-header detection fall back to the account's currency on failure instead of throwing. Regression tests added: malformedRowIsSkippedInsteadOfFailingWholeImport, csvRowWithInvalidCurrencyCodeFallsBackInsteadOfFailingWholeImport. testDebugUnitTest and compileDebugKotlin passed. Not verified against a real garbled bank PDF/CSV on-device — no emulator available this session."
    status: in_progress
  - id: import.document-picker
    ios: MManger/Views/DocumentPicker.swift; MManger/Views/ImportPDFView.swift
    android: app/ProMoneyManagerApp.kt (ImportScreen); app/importing/ImportDocumentReader.kt
    acceptance: Android's system document picker (ACTION_OPEN_DOCUMENT) lets the user select PDF, CSV, or plain-text files without requesting broad storage permission, and preserves the selected source name and account through review. XLSX is intentionally not offered by the picker or reader.
    evidence: app/ImportReviewTest.kt (button present); manually verified end to end on emulator-5554 2026-07-12 — a real searchable PDF pushed to /sdcard/Download was selected via the live DocumentsUI picker, read through ContentResolver, parsed into 3 rows, saved, and confirmed in the Transactions list with correct amounts and "Imported from <file> row N" provenance. No automated instrumented test drives the picker itself (Espresso-Intents stubbing not yet added).
    status: verified
  - id: import.searchable-pdf
    ios: MManger/Services/BankStatementPDFParser.swift; MManger/Views/ImportPDFView.swift
    android: app/importing/ImportDocumentReader.kt; core/domain/ImportParsers.kt
    acceptance: A user-selected searchable PDF is read locally off the main thread via pdfbox-android, its text is extracted and parsed into review rows, and empty, scanned, corrupt, protected, oversized, revoked-access, and cancellation failures are actionable and do not save data.
    evidence: app/src/test/.../importing/ImportDocumentReaderTest.kt; manually verified end to end on emulator-5554 2026-07-12 (see import.document-picker). Failure-path behaviors (scanned/corrupt/protected/oversized/revoked-access) are covered by the reader unit test but not independently exercised on-device with real malformed files.
    status: verified
