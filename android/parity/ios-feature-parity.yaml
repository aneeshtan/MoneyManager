  - id: import.review-ui
    ios: MManger/Views/ImportView.swift
    android: app/AppViewModel.kt; app/ProMoneyManagerApp.kt
    acceptance: Android import lets users choose an account and PDF/CSV/text/XLSX source or paste text, see parsed/selected/duplicate/review counts, select clean rows, edit review rows, save selected rows, and view imported source metadata in Transactions.
    evidence: "app/ImportReviewTest.kt. This session found and fixed four real bugs discovered by a self-directed code review of this exact flow (not previously caught): (1) review-only rows (currently CASHBACK income) had their checkbox permanently disabled in both the UI and the ViewModel's toggle guard, making them impossible to ever select or save despite the backend already accepting them if selected — checkboxes are now enabled for any non-duplicate row; (2) the suggested-category text showed the raw CategoryId string (e.g. a UUID-like value) instead of the category name — now resolved via a categories name map; (3) the row amount used the old hardcoded-2-decimal-places formatting bug fixed elsewhere this session but missed here — now uses AppFormatters.money; (4) rows were entirely read-only with no way to correct a misparsed merchant, amount, category, or missing date before saving — added a new ImportRowEditorSheet (tap any non-duplicate row) plus AppViewModel.editImportRow, and the row now also displays its parsed date (or an explicit 'No date detected' warning) so date-parsing ambiguity is visible before saving, not just after. compileDebugKotlin, compileDebugAndroidTestKotlin, testDebugUnitTest, and lintDebug all passed after these fixes; ImportReviewTest.kt's existing scenario (which relies on the CASHBACK row staying unselected by default) was re-verified by reading the fix against the test rather than by running it live — no emulator was available this session."
    status: in_progress
