  - id: planning.reminder-plans
    ios: MManger/Views/ScheduledTransactionView.swift
    android: core/model/PlanningModels.kt; core/domain/PlanningCalculators.kt; app/reminders/ReminderScheduler.kt; app/reminders/ReminderNotificationWorker.kt; app/ProMoneyManagerApp.kt; app/SettingsPanels.kt; app/AndroidManifest.xml
    acceptance: "POLICY CHANGE from the prior slice: reminder plans are deterministic local records scheduled for 09:00 the day before the next occurrence, expose permission/disabled state, and are now actually delivered — WorkManager schedules one-time work per active reminder, and enabling reminders requests Android's POST_NOTIFICATIONS runtime permission (API 33+) via a new More > Notifications toggle. The prior acceptance text explicitly scoped this slice to NOT request that permission; this change reverses that scoping decision and should be confirmed as an intended product decision (e.g. Play Store listing/review implications) before shipping, the same way SMS import is gated behind explicit policy approval."
    evidence: core/domain/ScheduleCalculatorTest.kt; app/PlanningToolsTest.kt; compileDebugKotlin, compileDebugAndroidTestKotlin, and testDebugUnitTest passed; lintDebug, assembleDebug, and bundleRelease succeeded. connectedDebugAndroidTest was not rerun this session (no emulator attached), so actual notification delivery timing/permission-prompt behavior is unverified on a real device — needs on-device verification before shipping.
